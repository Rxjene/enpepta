name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Banking backtest (cutoff 1925)
        run: npm run backtest -- --industry banking --cutoff 1925
      - name: Build
        run: npm run build

  # Deploys only after every check above passed, and only from main.
  # Turn OFF Vercel's own "deploy on every git push" (Project Settings > Git) so this job is the only way to deploy.
  # Needs repository secrets VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID. Without them this job is skipped.
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip if Vercel secrets are not set
        id: gate
        run: echo "go=${{ env.VERCEL_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'true'
        with:
          node-version: 22
      - name: Deploy to Vercel (production)
        if: steps.gate.outputs.go == 'true'
        run: |
          npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
